<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track competitive Pokémon builds, HOME inventory, and teams across current games.">
  <title>Pokémon HOME Tracker</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/npm/pokesprite-images/items/ball/poke.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/boxes.css">
  <link rel="stylesheet" href="css/details.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <h1 class="logo">
        <img src="https://cdn.jsdelivr.net/npm/pokesprite-images/items/ball/poke.png" alt="" class="logo-img" width="30" height="30">
        Pokémon HOME Tracker
      </h1>
      <div id="auth-widget" class="auth-widget"></div>
      <div class="progress-bar" role="progressbar" aria-label="Collection progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress-text" id="progress-text">0 / 0</span>
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="header-controls">
      <nav class="view-tabs" id="view-tabs" aria-label="Primary">
        <button type="button" class="view-tab is-active" id="tab-boxes" data-view="boxes" aria-current="page">Boxes</button>
        <button type="button" class="view-tab" id="tab-inventory" data-view="inventory">Inventory</button>
        <button type="button" class="view-tab" id="tab-builds" data-view="builds">Builds</button>
        <button type="button" class="view-tab" id="tab-teams" data-view="teams">Teams</button>
        <button type="button" class="view-tab" id="tab-settings" data-view="settings">Settings</button>
      </div>
      </nav>
      <label class="visually-hidden" for="search-input">Search current section</label>
      <input type="search" id="search-input" class="search-input" placeholder="Search Pokémon..." autocomplete="off">
    </div>
  </header>

  <main class="main-content" id="main-content">
    <!-- Router manages content here -->
  </main>

  <!-- Detail Panel (slide-out sidebar or overlay — FR-1.0a) -->
  <div class="detail-overlay" id="detail-overlay" aria-hidden="true"></div>
  <aside class="detail-panel" id="detail-panel" role="dialog" aria-label="Details" aria-hidden="true" tabindex="-1" inert>
    <div class="detail-panel-controls">
      <button class="detail-layout-toggle" id="detail-layout-toggle" type="button" title="Toggle layout">Overlay</button>
      <button class="detail-close" id="detail-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="detail-content" id="detail-content">
      <!-- Populated by JS -->
    </div>
  </aside>

  <footer class="site-footer">
    <p>Pokémon HOME Tracker — Data from <a href="https://github.com/smogon/pokemon-showdown" target="_blank" rel="noopener noreferrer">Smogon</a> | Sprites from <a href="https://play.pokemonshowdown.com/sprites/" target="_blank" rel="noopener noreferrer">Pokémon Showdown</a></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
