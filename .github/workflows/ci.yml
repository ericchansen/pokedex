name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: JavaScript and CSS lint
        run: npm run lint

      - name: Checked JavaScript
        run: npm run typecheck

      - name: Module architecture
        run: npm run validate:modules

      - name: Data and domain contracts
        run: npm run validate:contracts

      - name: Frontend unit tests
        run: npm run test:unit

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Ruff
        run: npm run lint:py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: API tests
        run: npm run test:py

  edge-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      - name: Microsoft Edge browser tests
        run: npm run test:frontend
